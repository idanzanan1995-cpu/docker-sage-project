apiVersion: apps/v1
kind: Deployment

metadata:
  name: docker-sage-deployment
  namespace: dev

spec:
  replicas: 3

  selector:
    matchLabels:
      app: docker-sage

  template:
    metadata:
      labels:
        app: docker-sage

    spec:
      containers:
        - name: app
          image: docker-sage-assignment:v5
          imagePullPolicy: Never

          ports:
            - containerPort: 8080

          env:
            - name: ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ENV

                  